<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVBuilder | კონტაქტი</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="../index.html">CV<span>Builder</span></a>
        <button
          type="button"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          მენიუ
        </button>
        <nav class="site-nav" id="site-nav" aria-label="მთავარი ნავიგაცია">
          <ul>
            <li><a class="nav-link" href="../index.html">მთავარი</a></li>
            <li><a class="nav-link" href="editor.html">რედაქტორი</a></li>
            <li><a class="nav-link" href="templates.html">შაბლონები</a></li>
            <li><a class="nav-link" href="my-cvs.html">ჩემი რეზიუმეები</a></li>
            <li><a class="nav-link" href="help.html">დახმარება</a></li>
            <li>
              <a class="nav-link" href="contact.html" aria-current="page"
                >კონტაქტი</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="page-header">
        <h1>კონტაქტი</h1>
        <p>
          დაგვიტოვე შეტყობინება და უკუკავშირს მივიღებთ.
          <span class="required-mark">*</span> სავალდებულო ველია.
        </p>
      </div>

      <form id="contact-form" class="card contact-form" novalidate>
        <div class="form-group">
          <label for="name"
            >სახელი
            <span class="required-mark" aria-hidden="true">*</span></label
          >
          <input
            type="text"
            id="name"
            name="name"
            required
            data-validate="name"
            autocomplete="name"
          />
        </div>
        <div class="form-group">
          <label for="contact-email"
            >ელფოსტა
            <span class="required-mark" aria-hidden="true">*</span></label
          >
          <input
            type="email"
            id="contact-email"
            name="email"
            required
            data-validate="email"
            autocomplete="email"
          />
        </div>
        <div class="form-group">
          <label for="phone-contact">ტელეფონი (არასავალდებულო)</label>
          <input
            type="tel"
            id="phone-contact"
            name="phone"
            data-validate="phone"
            autocomplete="tel"
          />
        </div>
        <div class="form-group">
          <label for="message"
            >შეტყობინება
            <span class="required-mark" aria-hidden="true">*</span></label
          >
          <textarea
            id="message"
            name="message"
            required
            minlength="10"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">გაგზავნა</button>
      </form>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 CVBuilder</p>
        <p>ავტორი: ნინო შარაშიძე</p>
      </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
