<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">CV<span>Builder</span></a>
      <nav class="site-nav" aria-label="მთავარი ნავიგაცია">
        <ul>
          <li><a class="nav-link" href="../index.html">მთავარი</a></li>
          <li><a class="nav-link" href="editor.html">რედაქტორი</a></li>

      </nav>

  <main>
    <div class="page-header">
      <h1>კონტაქტი</h1>
      <p>დაგვიტოვე შეტყობინება და უკუკავშირს მივიღებთ.</p>
    </div>

    <form class="card" novalidate style="max-width: 36rem;">
      <div class="form-group">
        <label for="name">სახელი</label>
        <input type="text" id="name" name="name">
      </div>
      <div class="form-group">
        <label for="contact-email">ელფოსტა</label>
        <input type="email" id="contact-email" name="email">
      </div>
      <div class="form-group">
        <label for="message">შეტყობინება</label>
        <textarea id="message" name="message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">გაგზავნა</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 CVBuilder</p>
      <p>ავტორი: ნინო შარაშიძე</p>
    </div>
  </footer>
